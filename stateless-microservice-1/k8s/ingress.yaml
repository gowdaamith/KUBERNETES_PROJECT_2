apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: statelessapp-ingress
spec: 
  rules:
  - host: statelessapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: statelessapp-service
            port: 
              number: 80

