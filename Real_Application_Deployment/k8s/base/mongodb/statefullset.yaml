apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: mongodb
spec: 
  serviceName: mongo-service
  replica: 1
  selector: 
    matchLabels:
      app: mongo
  temmplate: 
    metadata: 
      labels: 
        app: mongo
    spec: 
      containers:
        - name: mongodb
          image: mongo:6
          ports: 
            - containerPort: 27017
          env: 
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: 
                secretKeyRef: 
                  name: db-secret
                  key: DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: db-secret
                  key: DB_PASS
          volumeMounts: 
            - name: mongo-storage
              mountPath: /data/db

  volumeClaimTemplates:
    - metadata: 
        name: mongo-storage
      spec: 
        accessModes:
          - ReadWriteOnce
        resource: 
          requests:
            storage: 1Gi
