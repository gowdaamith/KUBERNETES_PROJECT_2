apiVersion: 
kind: Service
metadata: 
  name:  {{ .Values.service.name }}
spec: 
  selector: 
    app: {{ .Values.service.app }}
  ports: 
    - protocol: {{ .Values.service.protocol }}
      port: {{ .Values.service.prot }}
      targetPort: {{ .Values.service.targerPort }}
  type:  {{ .Values.service.type }}
